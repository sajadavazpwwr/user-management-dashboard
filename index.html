    <main>
        <header>
            <h1>User Management </h1>
            <div class="header-butm">
                <div class="div-serch">
                    <label for="serch"><i class="fa-solid fa-magnifying-glass"></i></label>
                    <input type="text" name="serch" id="serch" placeholder=" Search users...">
                </div>
                <div class="div-addUser">
                    <button class="but user">+ Add User</button>
                </div>
            </div>
        </header>
        <section class="addUser">
            <div class="divAddNewUser displaynone">
                <div class="divInpNewUser">
                    <input type="text" class="addNewName" placeholder="Name User...">
                    <input type="text" class="addNewEmail" placeholder="Email User...">
                    <input type="text" class="addNewPhone" placeholder="Phone User...">
                </div>
                <button class="cancelNewUser btnHover">Cancel</button>
                <button class="NewUserDone btnHover">Add User</button>
            </div>
        </section>
        <section class="section-user">
            <div class="userFond displaynone">
                <p>User Has Not Found</p>
            </div>
            <div class="FailedLoad displaynone">
                <p class="responseMessage">Failed to load users. Please try again</p>
            </div>
            <div class="updateUsers displaynone">
                <div class="divInpUpdate ">
                    <input type="text" class="updateName" placeholder="Name User...">
                    <input type="text" class="updateEmail" placeholder="Email User...">
                    <input type="number" class="updatePhone" placeholder="Phone User...">
                </div>
                <button class="cancelUpdate btnHover">Cancel</button>
                <button class="UpdateDone btnHover">Done</button>
